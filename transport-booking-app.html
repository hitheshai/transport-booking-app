<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transit — Book any way to get there</title>
<style>
  :root{
    --ink:#14211f;
    --paper:#eef2ee;
    --line:#c9d3c8;
    --rail:#2f5d4f;
    --road:#c85a3a;
    --air:#3a6ea5;
    --water:#4a8fa3;
    --accent:#e8c34a;
    --card:#ffffff;
    --muted:#5c6b64;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
  }
  @font-face{
    font-family:'Fraunces-fallback';
    src:local('Georgia');
  }
  .display{
    font-family: Georgia, 'Fraunces-fallback', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  header{
    padding:28px 32px 20px;
    border-bottom:2px solid var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .logo{
    font-size:26px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-mark{
    width:14px; height:14px;
    background:var(--road);
    border-radius:50%;
    box-shadow: 18px 0 0 var(--rail), 36px 0 0 var(--air);
    margin-right:26px;
  }
  .tagline{
    font-size:13px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.12em;
  }

  main{
    max-width:1040px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  .modes{
    display:flex;
    gap:10px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .mode-btn{
    flex:1;
    min-width:110px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:10px;
    padding:14px 10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--muted);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .mode-btn:hover{ transform:translateY(-2px); }
  .mode-btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .mode-btn .icon{ font-size:22px; }
  .mode-btn.active{
    border-color: var(--ink);
    color: var(--ink);
    font-weight:600;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .mode-btn[data-mode="road"].active{ border-color:var(--road); box-shadow:3px 3px 0 var(--road); color:var(--road); }
  .mode-btn[data-mode="rail"].active{ border-color:var(--rail); box-shadow:3px 3px 0 var(--rail); color:var(--rail); }
  .mode-btn[data-mode="air"].active{ border-color:var(--air); box-shadow:3px 3px 0 var(--air); color:var(--air); }
  .mode-btn[data-mode="water"].active{ border-color:var(--water); box-shadow:3px 3px 0 var(--water); color:var(--water); }

  .booking-card{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:14px;
    padding:28px;
    box-shadow:6px 6px 0 var(--ink);
  }
  .route-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
  }
  .field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
  }
  .field input, .field select{
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    padding:8px 2px;
    font-size:18px;
    font-family:Georgia, serif;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-bottom-color: var(--ink);
  }
  .swap-btn{
    align-self:flex-end;
    margin-bottom:8px;
    width:36px; height:36px;
    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--paper);
    cursor:pointer;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .swap-btn:hover{ background:var(--ink); color:var(--paper); }
  .swap-btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

  .sub-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .sub-row .field{ min-width:140px; flex:1; }

  .search-btn{
    width:100%;
    padding:16px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .15s ease;
  }
  .search-btn:hover{ background:#0a1613; }
  .search-btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

  .results{
    margin-top:36px;
  }
  .results h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .result-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:12px;
    animation: fadeIn .35s ease both;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .result-card .stripe{
    width:5px; align-self:stretch; border-radius:4px;
  }
  .result-card .details{ flex:1; }
  .result-card .op{ font-weight:600; font-size:15px; }
  .result-card .meta{ font-size:13px; color:var(--muted); margin-top:2px; }
  .result-card .time{
    font-family:Georgia, serif;
    font-size:20px;
    min-width:120px;
    text-align:center;
  }
  .result-card .price{
    font-family:Georgia, serif;
    font-size:22px;
    font-weight:600;
    min-width:90px;
    text-align:right;
  }
  .book-btn{
    background:transparent;
    border:2px solid var(--ink);
    border-radius:6px;
    padding:8px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .book-btn:hover{ background:var(--ink); color:var(--paper); }
  .book-btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .book-btn.booked{
    background:var(--rail);
    border-color:var(--rail);
    color:white;
    cursor:default;
  }

  footer{
    text-align:center;
    padding:24px;
    font-size:12px;
    color:var(--muted);
  }

  @media (max-width:640px){
    .route-row{ flex-direction:column; align-items:stretch; }
    .swap-btn{ align-self:center; transform:rotate(90deg); }
    .result-card{ flex-wrap:wrap; }
    .result-card .time, .result-card .price{ text-align:left; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-mark"></span>
    <span class="display">Transit</span>
  </div>
  <span class="tagline">Road · Rail · Air · Water — one ticket window</span>
</header>

<main>
  <div class="modes" role="tablist" aria-label="Transport mode">
    <button class="mode-btn active" data-mode="road" role="tab" aria-selected="true">
      <span class="icon">🚗</span> Cab / Bus
    </button>
    <button class="mode-btn" data-mode="rail" role="tab" aria-selected="false">
      <span class="icon">🚆</span> Train
    </button>
    <button class="mode-btn" data-mode="air" role="tab" aria-selected="false">
      <span class="icon">✈️</span> Flight
    </button>
    <button class="mode-btn" data-mode="water" role="tab" aria-selected="false">
      <span class="icon">⛴️</span> Ferry
    </button>
  </div>

  <div class="booking-card">
    <div class="route-row">
      <div class="field">
        <label for="from">From</label>
        <input id="from" type="text" value="Mysuru" placeholder="Departure city">
      </div>
      <button class="swap-btn" id="swapBtn" aria-label="Swap origin and destination">⇄</button>
      <div class="field">
        <label for="to">To</label>
        <input id="to" type="text" value="Bengaluru" placeholder="Destination city">
      </div>
    </div>

    <div class="sub-row">
      <div class="field">
        <label for="date">Depart</label>
        <input id="date" type="date">
      </div>
      <div class="field" id="returnField" style="display:none;">
        <label for="returnDate">Return</label>
        <input id="returnDate" type="date">
      </div>
      <div class="field">
        <label for="pax">Travellers</label>
        <select id="pax">
          <option>1 traveller</option>
          <option selected>2 travellers</option>
          <option>3 travellers</option>
          <option>4+ travellers</option>
        </select>
      </div>
      <div class="field">
        <label for="cls">Class / type</label>
        <select id="cls">
          <option>Standard</option>
          <option>Premium</option>
          <option>First / Business</option>
        </select>
      </div>
    </div>

    <button class="search-btn" id="searchBtn">Search options</button>
  </div>

  <div class="results" id="results" style="display:none;">
    <h2><span id="resultsTitle">Options</span> <span id="resultsCount"></span></h2>
    <div id="resultsList"></div>
  </div>
</main>

<footer>Mock interface for demonstration — no real bookings are made.</footer>

<script>
const modeData = {
  road: {
    title: 'Cabs & buses',
    color: 'var(--road)',
    options: [
      {op:'Metro Cab · Sedan', meta:'AC · 4 seats · Door to door', time:'Leaves in 8 min', price:'₹1,240'},
      {op:'Express Bus Line', meta:'AC Sleeper · 40 seats', time:'9:30 PM → 5:00 AM', price:'₹680'},
      {op:'City Shuttle', meta:'Shared · 6 seats', time:'Leaves in 22 min', price:'₹390'},
    ]
  },
  rail: {
    title: 'Trains',
    color: 'var(--rail)',
    options: [
      {op:'Shatabdi Express', meta:'Chair Car · Seat 24A', time:'6:15 AM → 9:05 AM', price:'₹745'},
      {op:'Intercity Superfast', meta:'Sleeper · 3AC', time:'11:00 PM → 6:20 AM', price:'₹560'},
      {op:'Passenger Local', meta:'General', time:'2:40 PM → 6:10 PM', price:'₹120'},
    ]
  },
  air: {
    title: 'Flights',
    color: 'var(--air)',
    options: [
      {op:'IndiGo 6E-204', meta:'Non-stop · Economy', time:'7:05 AM → 8:20 AM', price:'₹4,150'},
      {op:'Air India AI-508', meta:'Non-stop · Economy', time:'1:15 PM → 2:30 PM', price:'₹3,890'},
      {op:'Vistara UK-822', meta:'Non-stop · Premium Economy', time:'6:40 PM → 7:55 PM', price:'₹6,300'},
    ]
  },
  water: {
    title: 'Ferries',
    color: 'var(--water)',
    options: [
      {op:'Harbor Line Ferry', meta:'Open deck', time:'10:00 AM → 11:15 AM', price:'₹250'},
      {op:'Island Express', meta:'AC cabin', time:'3:30 PM → 5:00 PM', price:'₹580'},
    ]
  }
};

let currentMode = 'road';

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>{
      b.classList.remove('active');
      b.setAttribute('aria-selected','false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    currentMode = btn.dataset.mode;
    document.getElementById('returnField').style.display = currentMode === 'air' ? 'flex' : 'none';
    document.getElementById('results').style.display = 'none';
  });
});

document.getElementById('swapBtn').addEventListener('click', ()=>{
  const from = document.getElementById('from');
  const to = document.getElementById('to');
  [from.value, to.value] = [to.value, from.value];
});

document.getElementById('searchBtn').addEventListener('click', ()=>{
  const data = modeData[currentMode];
  const list = document.getElementById('resultsList');
  list.innerHTML = '';
  document.getElementById('resultsTitle').textContent = data.title;
  document.getElementById('resultsCount').textContent = `· ${data.options.length} found`;

  data.options.forEach((o, i)=>{
    const card = document.createElement('div');
    card.className = 'result-card';
    card.style.animationDelay = (i*0.06)+'s';
    card.innerHTML = `
      <div class="stripe" style="background:${data.color}"></div>
      <div class="details">
        <div class="op">${o.op}</div>
        <div class="meta">${o.meta}</div>
      </div>
      <div class="time">${o.time}</div>
      <div class="price">${o.price}</div>
      <button class="book-btn">Book</button>
    `;
    card.querySelector('.book-btn').addEventListener('click', function(){
      this.textContent = 'Booked ✓';
      this.classList.add('booked');
      this.disabled = true;
    });
    list.appendChild(card);
  });

  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
});

// default date to today
document.getElementById('date').valueAsDate = new Date();
</script>

</body>
</html>
